name: Preview

on:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  preview:
    # Repository secrets are unavailable to pull requests from forks
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write # to comment the Preview URL
    environment:
      name: preview
      url: ${{ steps.preview.outputs.url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      # Creates or updates the Worker Preview for this pull request.
      # Previews are not deleted on close; Cloudflare evicts the least recently
      # deployed one when the per-Worker limit is reached.
      - id: preview
        run: |
          set -o pipefail
          output="$(vp exec cf previews deploy "pr-${PR_NUMBER}")"
          printf '%s\n' "$output"
          {
            echo "url=$(printf '%s' "$output" | jq -er '.preview_urls[0]')"
            echo "deployment_url=$(printf '%s' "$output" | jq -er '.deployment_urls[0]')"
          } >> "$GITHUB_OUTPUT"
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      # Keep a single comment per pull request, updated on every push
      - run: |
          marker='<!-- workers-preview -->'
          body="$(cat <<EOF
          ${marker}
          ### Workers Preview

          | | URL |
          | --- | --- |
          | Preview (latest) | ${PREVIEW_URL} |
          | This deployment (\`${HEAD_SHA::7}\`) | ${DEPLOYMENT_URL} |
          EOF
          )"
          comment_id="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"${marker}\"))) | .id" | head -n1)"
          if [ -n "$comment_id" ]; then
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${comment_id}" -f body="$body" > /dev/null
          else
            gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" -f body="$body" > /dev/null
          fi
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PREVIEW_URL: ${{ steps.preview.outputs.url }}
          DEPLOYMENT_URL: ${{ steps.preview.outputs.deployment_url }}

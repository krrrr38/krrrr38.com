name: Setup
description: Install node and vp from mise.toml, then install dependencies with the pnpm store cached

runs:
  using: composite
  steps:
    - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
      with:
        install_args: node github:voidzero-dev/vite-plus
    - name: Get pnpm store path
      id: pnpm-store
      shell: bash
      working-directory: site
      run: echo "path=$(vp exec pnpm store path)" >> "$GITHUB_OUTPUT"
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.pnpm-store.outputs.path }}
        key: pnpm-store-${{ runner.os }}-${{ hashFiles('site/pnpm-lock.yaml') }}
        restore-keys: pnpm-store-${{ runner.os }}-
    - shell: bash
      working-directory: site
      run: vp install
